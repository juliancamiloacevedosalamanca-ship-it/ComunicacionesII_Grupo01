<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430" font-family="Helvetica, Arial, sans-serif">
  <rect width="1100" height="430" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
  </defs>
  <text x="550" y="28" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">Enlace físico de prueba (Fase 3) — Grupo 1, S1</text>

  <!-- PC Tx -->
  <rect x="20" y="70" width="170" height="110" rx="8" fill="#eef4ff" stroke="#1f5fa8" stroke-width="2"/>
  <text x="105" y="98" font-size="15" font-weight="bold" text-anchor="middle">PC 1 (Tx)</text>
  <text x="105" y="120" font-size="12" text-anchor="middle">GNU Radio</text>
  <text x="105" y="138" font-size="12" text-anchor="middle">Fase3_HackRF_TX</text>
  <text x="105" y="156" font-size="12" text-anchor="middle">bb_rate 256 kS/s</text>
  <text x="105" y="172" font-size="12" text-anchor="middle">×125/16 → 2 MS/s</text>

  <line x1="190" y1="125" x2="250" y2="125" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="220" y="115" font-size="11" text-anchor="middle">USB 2.0</text>

  <!-- HackRF Tx -->
  <rect x="252" y="80" width="170" height="90" rx="8" fill="#fff4e5" stroke="#d97706" stroke-width="2"/>
  <text x="337" y="106" font-size="15" font-weight="bold" text-anchor="middle">HackRF One #1</text>
  <text x="337" y="126" font-size="12" text-anchor="middle">Osmocom Sink</text>
  <text x="337" y="144" font-size="12" text-anchor="middle">LO = 960 MHz − 200 kHz</text>
  <text x="337" y="161" font-size="12" text-anchor="middle">IF 20 dB · amp RF off</text>

  <!-- cable path -->
  <line x1="422" y1="125" x2="500" y2="125" stroke="#555" stroke-width="5"/>
  <text x="461" y="113" font-size="11" text-anchor="middle">coax SMA</text>
  <rect x="500" y="100" width="110" height="50" rx="6" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="555" y="122" font-size="13" font-weight="bold" text-anchor="middle">Atenuador</text>
  <text x="555" y="140" font-size="12" text-anchor="middle">30–40 dB</text>
  <line x1="610" y1="125" x2="688" y2="125" stroke="#555" stroke-width="5"/>
  <text x="649" y="113" font-size="11" text-anchor="middle">coax SMA</text>

  <!-- HackRF Rx -->
  <rect x="688" y="80" width="170" height="90" rx="8" fill="#fff4e5" stroke="#d97706" stroke-width="2"/>
  <text x="773" y="106" font-size="15" font-weight="bold" text-anchor="middle">HackRF One #2</text>
  <text x="773" y="126" font-size="12" text-anchor="middle">Osmocom Source</text>
  <text x="773" y="144" font-size="12" text-anchor="middle">LO = 960 MHz + 200 kHz</text>
  <text x="773" y="161" font-size="12" text-anchor="middle">LNA 16 dB · VGA 20 dB</text>

  <line x1="858" y1="125" x2="908" y2="125" stroke="#333" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="883" y="115" font-size="11" text-anchor="middle">USB 2.0</text>

  <!-- PC Rx -->
  <rect x="910" y="70" width="170" height="110" rx="8" fill="#eefaf1" stroke="#16a34a" stroke-width="2"/>
  <text x="995" y="98" font-size="15" font-weight="bold" text-anchor="middle">PC 2 (Rx)</text>
  <text x="995" y="120" font-size="12" text-anchor="middle">GNU Radio</text>
  <text x="995" y="138" font-size="12" text-anchor="middle">Fase3_HackRF_RX</text>
  <text x="995" y="156" font-size="12" text-anchor="middle">×16/125 → 256 kS/s</text>
  <text x="995" y="172" font-size="12" text-anchor="middle">AGC·FLL·PFB·Costas</text>

  <text x="555" y="190" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Opción 1 — prueba conducida (recomendada primero)</text>

  <!-- Option 2: over the air -->
  <line x1="40" y1="215" x2="1060" y2="215" stroke="#d1d5db" stroke-dasharray="6 5"/>
  <rect x="252" y="250" width="170" height="70" rx="8" fill="#fff4e5" stroke="#d97706" stroke-width="2"/>
  <text x="337" y="280" font-size="15" font-weight="bold" text-anchor="middle">HackRF One #1</text>
  <text x="337" y="300" font-size="12" text-anchor="middle">puerto ANT (Tx)</text>
  <line x1="337" y1="250" x2="337" y2="232" stroke="#111" stroke-width="3"/>
  <path d="M325,232 L349,232 L337,240 z" fill="#111"/>
  <rect x="688" y="250" width="170" height="70" rx="8" fill="#fff4e5" stroke="#d97706" stroke-width="2"/>
  <text x="773" y="280" font-size="15" font-weight="bold" text-anchor="middle">HackRF One #2</text>
  <text x="773" y="300" font-size="12" text-anchor="middle">puerto ANT (Rx)</text>
  <line x1="773" y1="250" x2="773" y2="232" stroke="#111" stroke-width="3"/>
  <path d="M761,232 L785,232 L773,240 z" fill="#111"/>
  <path d="M380,240 q20,-15 0,-30" fill="none" stroke="#1f5fa8" stroke-width="2"/>
  <path d="M395,248 q30,-23 0,-46" fill="none" stroke="#1f5fa8" stroke-width="2"/>
  <path d="M730,240 q-20,-15 0,-30" fill="none" stroke="#1f5fa8" stroke-width="2"/>
  <path d="M715,248 q-30,-23 0,-46" fill="none" stroke="#1f5fa8" stroke-width="2"/>
  <line x1="430" y1="235" x2="680" y2="235" stroke="#1f5fa8" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#ar)"/>
  <text x="555" y="255" font-size="12" text-anchor="middle">camino directo, 1–3 m (práctica del 5 nov)</text>
  <text x="555" y="345" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2937">Opción 2 — prueba por aire con antenas</text>

  <text x="40" y="380" font-size="12" fill="#374151">Nunca conectar Tx y Rx directamente por coaxial sin atenuador: la potencia del Tx puede superar el máximo de entrada del Rx (≈ −5 dBm en HackRF) y dañar el LNA.</text>
  <text x="40" y="400" font-size="12" fill="#374151">Bias-T apagado en ambos radios. Throttle eliminado: el radio fija el ritmo de muestras. Con USRP: UHD Sink/Source, 1 MS/s (×125/32), puertos TX/RX y RX2.</text>
</svg>
